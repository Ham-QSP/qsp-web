name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to release, for example 1.2.3"
        required: true
        type: string

permissions:
  contents: write
  packages: read

concurrency:
  group: release-${{ inputs.version || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    env:
      VERSION: ${{ inputs.version }}
      RELEASE_TAG: v${{ inputs.version }}
      ARCHIVE_NAME: qsp-web-${{ inputs.version }}.tar.xz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate SemVer version
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::version must be a SemVer value such as 1.2.3, 1.2.3-rc.1, or 1.2.3+build.1"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          registry-url: https://npm.pkg.github.com
          scope: "@ham-qsp"

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --frozen-lockfile --non-interactive
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build production bundle
        run: yarn build-only

      - name: Build release archive
        run: |
          rm -rf release
          mkdir -p release/root
          cp -R dist/. release/root/
          cp README.md COPYING release/root/
          tar -C release/root -cJf "$ARCHIVE_NAME" .

      - name: Publish GitHub release
        run: |
          gh release create "$RELEASE_TAG" "$ARCHIVE_NAME" \
            --title "qsp-web $RELEASE_TAG" \
            --notes "Production build for qsp-web $RELEASE_TAG."
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Build
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # No Grype scan here: this image was already built and scanned by the
      # docker-latest job when this commit was pushed to main. The release
      # build reuses that layer cache and adds the version tag.
      - name: Build and push release image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          context: .
          file: .package/Dockerfile
          secrets: |
            node_auth=${{ secrets.GITHUB_TOKEN }}
          tags: |
            f4fez/qsp-web:${{ inputs.version }}
            f4fez/qsp-web:latest

  docker-latest:
    name: Build, scan and publish :latest image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Build
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # Build into the local daemon first so the image can be scanned before
      # it is published. The push below reuses this build from cache.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: false
          load: true
          tags: f4fez/qsp-web:latest
          context: .
          file: .package/Dockerfile
          secrets: |
            node_auth=${{ secrets.GITHUB_TOKEN }}

      - name: Scan image
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: f4fez/qsp-web:latest
          severity-cutoff: high
          # Only fail on vulnerabilities that have a fix available: an
          # unpatched base-image CVE must not block releases indefinitely.
          only-fixed: true
          fail-build: true
          output-format: sarif

      - name: Upload scan results
        # Publish findings even when the scan failed the build.
        if: always() && steps.scan.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: grype-container

      - name: Push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          tags: f4fez/qsp-web:latest
          context: .
          file: .package/Dockerfile
          secrets: |
            node_auth=${{ secrets.GITHUB_TOKEN }}
