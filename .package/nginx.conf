server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Runtime config: operators override this by bind-mounting their own
    # config.json over /usr/share/nginx/html/config.json. Disable caching so
    # a remounted/updated file is always picked up without a client reload
    # being stuck on a stale cached copy.
    location = /config.json {
        add_header Cache-Control "no-store";
    }

    # SPA fallback: unknown routes (deep links, browser refresh on a
    # vue-router path) must still serve index.html so client-side routing
    # can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
